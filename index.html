<html lang="pt-BR">
<head>

<title>Montagem de Motos • Supabase</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF0EC;--card:#FBFBF9;--ink:#17202A;--steel:#56646F;--line:#D3D8D2;--pend:#8A5A00;--pendbg:#FBEBC8;--ok:#17694A;--okbg:#D9EFE3;--bad:#A8231B;--badbg:#F8DEDB;--info:#1D4E7A;--infobg:#DCE9F4}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 'IBM Plex Sans',system-ui,sans-serif}
button,input{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--info);outline-offset:2px}
h1,h2,p{margin:0}h1{font-size:1.5rem}.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.mut{color:var(--steel)}.sm{font-size:.875rem}.ink{color:var(--ink)}.okc{color:var(--ok)}
.wrap{max-width:80rem;margin:0 auto;padding:16px 24px}.narrow{max-width:36rem;padding:12px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.g{gap:20px}.end{justify-content:flex-end;margin-top:16px}
.hd{position:sticky;top:0;z-index:20;background:rgba(238,240,236,.96);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.big{font-size:1.5rem;font-variant-numeric:tabular-nums}.dbpill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:.8rem;color:var(--steel)}.mid{text-align:center;padding:64px 0;font-size:1.1rem;color:var(--steel)}
.btn{height:44px;padding:0 16px;border-radius:6px;border:1px solid #B5BDB6;background:var(--card);font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:not-allowed}.pri{background:var(--info);border-color:var(--info);color:#fff}
.dng{background:var(--bad);border-color:var(--bad);color:#fff}.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.inp{height:44px;width:100%;border:1px solid #9AA39C;border-radius:6px;background:#fff;padding:0 12px;margin-top:4px}
label{display:block;font-weight:500;margin-top:12px}
.err{margin-top:8px;padding:8px 12px;border-radius:6px;background:var(--badbg);color:var(--bad);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;background:var(--card);margin:8px 0 16px}
.stats>div{padding:12px 20px;border-left:1px solid var(--line)}.stats>div:first-child{border:0}.stats b{display:block;font-size:1.9rem;font-variant-numeric:tabular-nums}
.pb{height:8px;background:var(--paper);border-radius:4px;overflow:hidden;margin:4px 0}.pb i{display:block;height:100%;background:var(--ok)}
.bar{justify-content:flex-start;margin-bottom:16px}.bar .inp{max-width:24rem;margin:0}.add{margin-left:auto;height:48px;font-size:1.1rem;padding:0 24px}
.tabs{display:flex;border:1px solid #B5BDB6;border-radius:6px;overflow:hidden}.tabs button{height:44px;padding:0 14px;border:0;background:var(--card);font-weight:500;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.tw{max-height:calc(100vh - 21rem);min-height:16rem;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{width:100%;min-width:52rem;border-collapse:collapse}th{position:sticky;top:0;background:#E3E7E2;color:var(--steel);font-size:.875rem;text-align:left;padding:12px 16px}
td{padding:12px 16px;border-top:1px solid var(--line)}td:first-child{border-left:4px solid var(--pend);color:var(--steel)}tr.d td:first-child{border-left-color:var(--ok)}
.bd{display:inline-block;padding:4px 10px;border-radius:99px;font-size:.875rem;font-weight:600;background:var(--pendbg);color:var(--pend)}.bd.d{background:var(--okbg);color:var(--ok)}
.bat{display:inline-flex;border:2px solid var(--ok);border-radius:4px;background:#fff;overflow:hidden}.bat i{background:var(--ok);padding:0 6px;display:flex;align-items:center;font-style:normal}.bat span{padding:2px 8px}.bat.lg{font-size:1.1rem}
.lk{border:0;background:none;padding:6px 12px;border-radius:4px;font-weight:500;cursor:pointer;color:var(--info)}.lk.x{color:var(--bad)}.lk:hover{background:var(--paper)}
.empty{border:2px dashed #9AA39C;border-radius:8px;padding:40px;text-align:center}
.list{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;border-left:8px solid var(--pend)}
.card.dn{border-left-color:var(--ok);padding:12px 14px}.mdl{font-size:1.5rem;font-weight:700;line-height:1.2}.cor{font-size:1.1rem}.ch{font-size:1.9rem;letter-spacing:.04em}
.bi{height:56px;width:100%;margin-top:4px;border:2px solid #7C877F;border-radius:6px;background:#fff;padding:0 12px;font-size:1.25rem;text-transform:uppercase}.bi::placeholder{text-transform:none}
.card form{margin-top:12px}.card .btn.okb{width:100%;height:56px;margin-top:12px;font-size:1.1rem;font-weight:700}
h2{font-size:1.1rem;margin-bottom:8px}.card.dn .bat{margin-top:8px}
#toasts{position:fixed;top:12px;right:12px;left:12px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.toast{pointer-events:auto;width:100%;max-width:24rem;background:var(--card);border-left:4px solid var(--ok);border-radius:6px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.2)}.toast.er{border-color:var(--bad)}.toast small{display:block;color:var(--steel)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(23,32,42,.5);display:grid;place-items:center;padding:16px}.box{width:100%;max-width:28rem;background:var(--card);border-radius:8px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.warn{background:var(--pendbg);color:var(--pend);padding:8px 12px;border-radius:6px;font-weight:500;margin-bottom:12px}
.home a{display:block;padding:18px;border-radius:8px;font-weight:600;font-size:1.1rem;margin-top:12px;text-decoration:none;background:var(--info);color:#fff}.home a+a{background:var(--card);color:var(--ink);border:1px solid #B5BDB6}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.stats>div:nth-child(3){border-left:0}.add{margin-left:0;width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== MODO LETRAS GRANDES (baixa visão) ===== */
:root{--steel:#2F3B46;--line:#8E988F;--ink:#0A1015}
html{font-size:18.5px}body{font-size:1rem;line-height:1.45}
:focus-visible{outline-width:5px}
.narrow{max-width:44rem;padding:16px 20px}
h1{font-size:2rem}h2{font-size:1.6rem;margin:8px 0 14px}
.big{font-size:2rem;font-weight:700}#conn{font-size:1rem}.mid{font-size:1.5rem}
.btn{height:56px;padding:0 24px;font-size:1.2rem;border-width:2px}
.list{gap:24px}
.card{border-width:2px;border-left-width:16px;padding:22px 24px}.card.dn{padding:18px 22px}
.mdl{font-size:2.1rem}.cor{font-size:1.6rem;color:var(--ink)}
.ch{font-size:3rem;font-weight:600;letter-spacing:.06em}
.card .sm{font-size:1.15rem}
.card label{font-size:1.4rem;font-weight:700}
.bi{height:72px;font-size:2.2rem;border-width:3px;border-color:var(--ink);letter-spacing:.12em;text-align:center}.bi::placeholder{letter-spacing:.08em;color:#8A949B}
.card .btn.okb{height:72px;font-size:1.5rem;margin-top:18px}
.err{font-size:1.3rem;padding:14px 16px;font-weight:600}
.empty{font-size:1.6rem;padding:48px 20px;border-width:3px}
.card.dn .row{font-size:1.6rem}.card.dn p{font-size:1.2rem}
.bat{border-width:3px}.bat span{padding:4px 14px;font-size:1.8rem}.bat i{padding:0 12px}
#toasts{top:8px}.toast{max-width:none;font-size:1.3rem;padding:18px 22px;border-left-width:14px}.toast small{font-size:1.2rem}
.db{position:relative;display:flex;align-items:stretch;gap:8px;margin:4px 0 10px}.nb{min-width:56px;height:64px;border:2px solid #B5BDB6;border-radius:8px;background:var(--card);font-size:2rem;font-weight:700;cursor:pointer}
.dpb{flex:1;min-height:64px;border:2px solid var(--ink);border-radius:8px;background:var(--card);font-size:1.15rem;font-weight:700;cursor:pointer;padding:6px 10px}
.dti{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}.dsub{margin-bottom:10px}#dtag{font-size:1.3rem;font-weight:600}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}.wd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border:2px solid #B5BDB6;border-radius:8px;background:var(--card);cursor:pointer}
.wd span{font-size:.75rem;color:var(--steel);font-weight:600}.wd b{font-size:1.4rem}.wd small{font-size:.75rem;color:var(--steel)}.wd.td{border-color:var(--info)}.wd.hp small{color:var(--pend);font-weight:700}.wd[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.wd[aria-pressed=true] span,.wd[aria-pressed=true] small{color:#fff}
.hr{font-size:1.3rem;font-weight:600;color:var(--info);margin-bottom:6px}.warn{font-size:1.15rem}.warn .lk{font-size:1.15rem;font-weight:700;text-decoration:underline}
@media(max-width:420px){.wd b{font-size:1.1rem}.wd small{font-size:.65rem}}
</style>

<body>
<div id="app"></div><div id="modal" hidden></div><div id="toasts" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(()=>{
/* ===== CONFIGURAÇÃO: preencha aqui OU use a tela #/config (salva neste navegador). Use somente a chave ANON. ===== */
const CFG={url:"https://qrmwgqkiwoenlkfzjazs.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFybXdncWtpd29lbmxrZnpqYXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MDc3OTIsImV4cCI6MjEwNjM4Mzc5Mn0.lhgkQS_WcB55uG0SKk0ngQgpc9oruFRt2H2D8orjNnc"};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pl=n=>n+(n===1?' moto':' motos');
const ft=i=>i?new Date(i).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
const MSG={gen:'Não foi possível salvar os dados. Verifique a conexão e tente novamente.',over:'Digite somente os 6 últimos dígitos do chassi.'};
const saved=(()=>{try{return JSON.parse(localStorage.getItem('motos_cfg')||'{}')}catch(e){return{}}})();
const URL_=CFG.url||saved.url,KEY=CFG.key||saved.key;
const route=location.hash.replace(/^#\/?/,'');
addEventListener('hashchange',()=>location.reload());

/* ---------- validação ---------- */
const vChassi=v=>!v?'Informe os 6 últimos dígitos do chassi.':/\D/.test(v)?'O chassi deve conter somente números (sem espaços).':v.length>6?MSG.over:v.length<6?'O chassi precisa ter exatamente 6 dígitos.':null;
const vBat=v=>{v=v.trim();if(!v)return 'Informe a data da bateria.';if(/[^0-9\/.\-\s]/.test(v))return 'Digite somente números: dia, mês e ano (ex.: 12/05/26).';const d=v.replace(/\D/g,'');if(d.length!==6)return 'Digite 6 números: dia, mês e ano (ex.: 12/05/26).';const dd=+d.slice(0,2),mm=+d.slice(2,4),yy=2000+(+d.slice(4)),t=new Date(yy,mm-1,dd);return t.getFullYear()===yy&&t.getMonth()===mm-1&&t.getDate()===dd?null:'Data inválida. Confira o dia e o mês (ex.: 12/05/26).'};
function fail(e){const t=((e&&e.message)||'')+' '+((e&&e.details)||''),c=e&&e.code;
 if(t.includes('BATERIA_DUPLICADA')||(c==='23505'&&t.includes('codigo_bateria')))return 'Código de bateria já utilizado. Esse código já está associado a outra moto.';
 if(c==='23505'&&t.includes('chassi'))return 'Chassi já cadastrado.';
 if(t.includes('BATERIA_VAZIA'))return 'Informe a data da bateria.';
 if(t.includes('BATERIA_INVALIDA'))return 'Data inválida. Digite dia, mês e ano (ex.: 12/05/26).';
 if(t.includes('MOTO_INEXISTENTE'))return 'Esta moto não existe mais. Ela pode ter sido removida pela entrega.';
 return MSG.gen}

/* ---------- UI comum ---------- */
function toast(t,x,k){const d=document.createElement('div');d.className='toast '+(k||'');d.innerHTML='<b>'+esc(t)+'</b>'+(x?'<small>'+esc(x)+'</small>':'');$('#toasts').append(d);setTimeout(()=>d.remove(),9000)}
function openModal(h){const m=$('#modal');m.innerHTML='<div class="box" role="dialog" aria-modal="true">'+h+'</div>';m.hidden=false;const a=m.querySelector('input,button');a&&a.focus()}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const actions={};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&actions[b.dataset.a])actions[b.dataset.a](b.dataset.id,b)});
const fmtBat=c=>/^\d{6}$/.test(c)?c.slice(0,2)+'/'+c.slice(2,4)+'/'+c.slice(4):c;
const bat=(c,l)=>c?'<span class="bat'+(l?' lg':'')+'"><i aria-hidden="true">🔋</i><span class="mono">'+esc(fmtBat(c))+'</span></span>':'<span class="mut">Aguardando</span>';

/* ---------- dados + realtime ---------- */
let sb,ch,motos=[],loaded=false,loadErr=false,conn='connecting';const removed=new Set(),hooks={render(){},onActivated:null,onNew:null};
const ts=m=>Date.parse(m.updated_at);
function setConn(s){conn=s;const e=$('#conn');if(e)e.textContent={connected:'🟢 Conectado',reconnecting:'🟠 Reconectando...',connecting:'🟠 Conectando...'}[s]}
function dbInfo(){
  const shortUrl=URL_||'—';
  return '<span class="dbpill" title="Projeto Supabase conectado">☁️ Supabase · '+esc(shortUrl.replace('https://',''))+'</span>';
}

function upsert(m,remote){if(removed.has(m.id))return;const i=motos.findIndex(x=>x.id===m.id),o=motos[i];if(o&&ts(o)>ts(m))return;
 if(remote&&o&&o.status!=='ativada'&&m.status==='ativada'&&hooks.onActivated)hooks.onActivated(m);
 if(remote&&!o&&hooks.onNew)hooks.onNew(m);
 if(i>=0)motos[i]=m;else{motos.push(m);motos.sort((a,b)=>a.seq-b.seq)}hooks.render()}
function drop(id){removed.add(id);motos=motos.filter(x=>x.id!==id);hooks.render()}
async function load(){const r=await sb.from('motos').select('*').order('seq');
 if(r.error){loadErr=true;if(!loaded)hooks.render();return}
 const loc=new Map(motos.map(m=>[m.id,m]));
 motos=r.data.filter(m=>!removed.has(m.id)).map(m=>{const l=loc.get(m.id);return l&&ts(l)>ts(m)?l:m});
 loaded=true;loadErr=false;hooks.render()}
function connect(){
 ch=sb.channel('motos-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:'motos'},p=>{
  if(p.eventType==='DELETE'){if(p.old&&p.old.id)drop(p.old.id)}else upsert(p.new,true)})
 .subscribe(s=>{if(s==='SUBSCRIBED'){setConn('connected');load()}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED')setConn('reconnecting')});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
 addEventListener('online',load);addEventListener('offline',()=>setConn('reconnecting'));
 addEventListener('pagehide',()=>sb.removeChannel(ch));load()}
async function add(v){const r=await sb.from('motos').insert(v).select().single();if(r.error)throw r.error;return r.data}
async function edit(id,v){const r=await sb.from('motos').update(v).eq('id',id).select().maybeSingle();if(r.error)throw r.error;if(!r.data)throw{message:'MOTO_INEXISTENTE'};return r.data}
async function del(id){const r=await sb.from('motos').delete().eq('id',id).select('id');if(r.error)throw r.error}
async function activate(id,code){const r=await sb.rpc('ativar_moto',{p_id:id,p_codigo:code});if(r.error)throw r.error;return Array.isArray(r.data)?r.data[0]:r.data}
function reconcile(parent,items,make,upd){const cur=new Map([...parent.children].map(e=>[e.dataset.id,e]));let prev=null;
 items.forEach(m=>{let e=cur.get(m.id);if(e){cur.delete(m.id);upd(e,m)}else e=make(m);const w=prev?prev.nextSibling:parent.firstChild;if(e!==w)parent.insertBefore(e,w);prev=e});
 cur.forEach(e=>e.remove())}
const loadHtml=()=>loadErr?'⚠️ Não foi possível carregar as motos do Supabase. <button class="btn" data-a="retry">Tentar novamente</button>':'Carregando motos...';
actions.retry=load;actions.close=closeModal;

/* ---------- MONTAGEM ---------- */
function assembly(){
 const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>iso(new Date()),addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
 const lbl=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase(),sh=s=>s.slice(8)+'/'+s.slice(5,7);
 const diff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
 const dtg=s=>{const x=diff(s,today());return x===0?'Hoje':x===1?'Amanhã':x===-1?'Ontem':x>1?'em '+x+' dias':'há '+(-x)+' dias'};
 const md=m=>m.data||today(),cmp=(a,b)=>{const x=a.horario||'99',y=b.horario||'99';return x<y?-1:x>y?1:a.seq-b.seq};
 let day=today();
 $('#app').innerHTML='<header class="hd"><div class="wrap narrow"><div class="row"><h1>Montagem de Motos</h1><span id="conn" class="mut"></span></div><b id="pc" class="big" aria-live="polite"></b></div></header>'
 +'<main class="wrap narrow"><p id="load" class="mid"></p><div id="body" hidden>'
 +'<div class="db"><button class="nb" data-a="dprev" title="Dia anterior (Alt+←)" aria-label="Dia anterior">‹</button><button class="dpb" data-a="pick" title="Escolher data"><span id="dl"></span> ▾</button><input id="dt" type="date" class="dti" tabindex="-1" aria-hidden="true"><button class="nb" data-a="dnext" title="Próximo dia (Alt+→)" aria-label="Próximo dia">›</button></div>'
 +'<div class="row dsub"><button class="btn" data-a="hoje" title="Ir para hoje (Alt+0)">📅 Hoje</button><span id="dtag" class="mut"></span></div>'
 +'<div id="wk" class="wk" aria-label="Semana"></div><p id="oth" class="warn" hidden></p>'
 +'<ul id="pend" class="list" aria-label="Motos pendentes"></ul><p id="empty" class="empty mut" hidden>Nenhuma moto aguardando montagem neste dia.</p><section id="dsec" hidden><h2 id="dh"></h2><ul id="done" class="list" style="gap:8px"></ul></section></div></main>';
 setConn(conn);
 const setDay=d=>{day=d;hooks.render()};
 actions.dprev=()=>setDay(addD(day,-1));actions.dnext=()=>setDay(addD(day,1));actions.hoje=()=>setDay(today());actions.day=id=>setDay(id);actions.jump=id=>setDay(id);
 actions.pick=()=>{const t=$('#dt');t.value=day;try{t.showPicker()}catch(e){t.focus();t.click()}};
 $('#dt').onchange=e=>{if(e.target.value)setDay(e.target.value)};
 addEventListener('keydown',e=>{if(e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.code==='Digit0')){e.preventDefault();setDay(e.code==='Digit0'?today():addD(day,e.key==='ArrowLeft'?-1:1))}});
 hooks.onNew=m=>toast('🏍️ Nova moto cadastrada',m.modelo+' · '+m.cor+' — '+m.chassi+(m.data?' · '+sh(m.data)+(m.horario?' '+m.horario:''):''));
 const hr=m=>m.horario?'🕒 '+m.horario:'🕒 Sem horário';
 const fill=(li,m)=>{li.querySelector('.hr').textContent=hr(m);li.querySelector('.mdl').textContent=m.modelo;li.querySelector('.cor').textContent=m.cor;li.querySelector('.ch').textContent=m.chassi};
 const updD=(li,m)=>{li.innerHTML='<div class="row"><b>'+esc(m.modelo)+' <span class="mut">· '+esc(m.cor)+'</span></b><b class="okc">✅ Ativada</b></div><p class="mut">'+(m.horario?'🕒 '+esc(m.horario)+' · ':'')+'Chassi <span class="mono ink">'+esc(m.chassi)+'</span> · '+ft(m.activated_at)+'</p>'+bat(m.codigo_bateria)};
 const makeD=m=>{const li=document.createElement('li');li.className='card dn';li.dataset.id=m.id;updD(li,m);return li};
 const makeP=m=>{const li=document.createElement('li');li.className='card';li.dataset.id=m.id;
  li.innerHTML='<p class="mono hr"></p><p class="mdl"></p><p class="mut cor"></p><p class="mut sm" style="margin-top:10px">Chassi</p><p class="mono ch"></p><form novalidate><label for="b-'+m.id+'" style="margin-top:0">Código da bateria <span class="mut sm">· dia/mês/ano</span></label><input id="b-'+m.id+'" class="bi mono" type="text" inputmode="numeric" maxlength="8" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="DD/MM/AA"><p class="err" role="alert" hidden></p><button class="btn okb">✅ Confirmar ativação</button></form>';
  fill(li,m);const f=li.querySelector('form'),inp=li.querySelector('input'),er=li.querySelector('.err'),bt=li.querySelector('button');
  inp.oninput=()=>{er.hidden=true;const d=inp.value.replace(/\D/g,'').slice(0,6);inp.value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d};
  f.onsubmit=async e=>{e.preventDefault();if(bt.disabled)return;const x=vBat(inp.value);if(x){er.textContent='⚠️ '+x;er.hidden=false;return}
   bt.disabled=inp.disabled=true;bt.textContent='⏳ Salvando...';
   try{const r=await activate(m.id,inp.value.replace(/\D/g,''));upsert(r,false);toast('✅ Bateria ativada com sucesso.',r.modelo+' — '+r.chassi)}
   catch(y){er.textContent='⚠️ '+fail(y);er.hidden=false}
   finally{bt.disabled=inp.disabled=false;bt.textContent='✅ Confirmar ativação'}};
  return li};
 hooks.render=()=>{$('#load').hidden=loaded;$('#body').hidden=!loaded;if(!loaded){$('#load').innerHTML=loadHtml();$('#pc').textContent='';return}
  const per=new Map();motos.forEach(m=>{const k=md(m),o=per.get(k)||{p:0,t:0};o.t++;if(m.status!=='ativada')o.p++;per.set(k,o)});
  const dm=motos.filter(m=>md(m)===day),p=dm.filter(m=>m.status!=='ativada').sort(cmp),d=dm.filter(m=>m.status==='ativada').sort(cmp);
  $('#pc').textContent='Pendentes: '+p.length;$('#dl').textContent=lbl(day);$('#dtag').textContent=dtg(day);
  const w0=addD(day,-((new Date(day+'T12:00:00').getDay()+6)%7)),hj=today();
  $('#wk').innerHTML=[0,1,2,3,4,5,6].map(i=>{const x=addD(w0,i),o=per.get(x)||{p:0,t:0};
   return `<button class="wd${x===hj?' td':''}${o.p?' hp':''}" data-a="day" data-id="${x}" aria-pressed="${x===day}" title="${lbl(x)}"><span>${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'][i]}</span><b>${x.slice(8)}</b><small>${o.p?o.p+' pend.':o.t?'✓ '+o.t:'—'}</small></button>`}).join('');
  const oth=[...per].filter(([k,o])=>k!==day&&o.p>0).sort((a,b)=>Math.abs(diff(a[0],day))-Math.abs(diff(b[0],day))||(a[0]<b[0]?-1:1)),tot=oth.reduce((n,[,o])=>n+o.p,0);
  $('#oth').hidden=!tot;if(tot)$('#oth').innerHTML='⚠️ '+tot+(tot===1?' moto pendente':' motos pendentes')+' em outros dias <button class="lk" data-a="jump" data-id="'+esc(oth[0][0])+'">Ir para '+sh(oth[0][0])+'</button>';
  reconcile($('#pend'),p,makeP,fill);reconcile($('#done'),d,makeD,updD);
  $('#empty').hidden=p.length>0;$('#dsec').hidden=!d.length;$('#dh').textContent='Ativadas: '+d.length};
 connect()}

if(!window.supabase){$('#app').innerHTML='<p class="mid">⚠️ Não foi possível carregar a biblioteca do Supabase. Verifique a internet e recarregue.</p>';return}
sb=supabase.createClient(URL_,KEY,{realtime:{params:{eventsPerSecond:20}}});
assembly();
})();
